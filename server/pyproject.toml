[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utto-server"
version = "0.1.0"
description = "Minimal FastAPI service for Utto."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.13,<2.0",
    "av>=14.0,<17.0",
    "faster-whisper>=1.2,<2.0",
    "httpx>=0.27,<1.0",
    "openpyxl>=3.1,<4.0",
    "Pillow>=10.4,<12.0",
    "pillow-heif>=0.21,<2.0",
    "pypdf>=5.0,<6.0",
    "python-docx>=1.1,<2.0",
    "python-pptx>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
utto-pairing-code = "utto_server.cli:generate_pairing_code"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
