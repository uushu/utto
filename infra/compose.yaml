name: utto

services:
  api:
    image: utto-api:0.1.0
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${UTTO_API_PORT:?UTTO_API_PORT is required}:8000"
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import json, urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8000/v1/health", timeout=2); assert response.status == 200 and json.load(response) == {"status": "ok", "service": "utto-server"}'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
    driver: local
